dns:
  # TCP DNS 始终启用；可选择在同一地址和端口启用 UDP DNS。
  listen: ":5353"
  udp_enabled: true
  # 未命中代理名单时，原始 DNS 请求会转发到这里。
  upstream: "1.1.1.1:53"
  network: "tcp"
  # 命中代理名单的 A/AAAA 查询返回以下地址（本机 IP 地址）。
  proxy_ipv4: "203.0.113.10"
  proxy_ipv6: ""
  ttl: 60

proxy:
  http_listen: ":80"
  tls_listen: ":443"
  http_target_port: 80
  tls_target_port: 443
  dial_timeout: "10s"

# 可选：内联域名及其所有子域名都会被代理。
proxy_domains:
  - example.com

# 可选：外部文本名单，相对路径按 config.yaml 所在目录解析。
# 每行一个域名，支持空行和以 # 开头或结尾的注释。
proxy_domains_file: "proxy-domains.example.txt"

# 可选。留空表示允许任意客户端；支持单个 IP 和 CIDR。
allow_clients:
  - 192.0.2.10
  - 2001:db8:1234::/48
